name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select arm64 architecture
        run: test "$(uname -m)" = arm64
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Whitespace check
        run: git diff --check
